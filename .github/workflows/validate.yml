name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run repo validator
        run: bash scripts/validate.sh
  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run repo validator (Windows PowerShell 5.1)
        shell: bash
        env:
          # Pin the interpreter so check 9 exercises powershell.exe 5.1; the
          # ubuntu job covers pwsh.
          JEFFY_PS: powershell
        run: bash scripts/validate.sh
